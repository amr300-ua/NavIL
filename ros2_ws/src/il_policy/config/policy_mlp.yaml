contract:
  scan_size: 90          # nº de rayos LiDAR 
  scan_max_range: 12.0   # m — inf/NaN y lecturas mayores se recortan a este valor
  goal_max_dist: 10.0    # m — para normalizar la distancia al objetivo
  v_max: 0.30            # m/s — límite de salida del modelo 
  w_max: 1.50            # rad/s

model:
  hidden: [128, 128, 64]
  dropout: 0.0

training:
  epochs: 60
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  val_frac: 0.15
  test_frac: 0.15
  patience: 10
  seed: 42
  device: cpu
