services:
  robotica:
    build:
      context: .
      dockerfile: Dockerfile
    image: navil-ros2:jazzy
    container_name: navil-robotica

    stdin_open: true
    tty: true

    environment:
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility,compute,display

    volumes:
      - ../ros2_ws:/home/developer/ros2_ws
      - /mnt/wslg:/mnt/wslg
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
    devices:
      - /dev/dri:/dev/dri
    working_dir: /home/developer/ros2_ws

    network_mode: host
    ipc: host

    gpus: all

    command: sleep infinity
